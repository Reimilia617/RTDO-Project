# rtdo 配置文件（TOML 格式）
# 信任目录：命令作用到这些目录内时自动放行，不弹窗。
# 支持通配符: * 匹配单个路径段内的任意字符, ** 匹配任意层级的路径段, ? 匹配单个字符。
trusted_paths = [
    "/etc/nixos",
    "/home/*/.config",
    "/usr/local/bin"
]

# 高危命令：任何情况下都会拦截，除非使用 --force。
# 单条命令名按 basename 精确匹配（如 "dd" 匹配任意位置调用的 dd）；
# 带参数的命令按“命令名 + 参数前缀”匹配（如 "rm -rf /" 匹配 rm -rf /...）。
blacklist_commands = [
    "dd",
    "mkfs",
    "rm -rf /",
    "chmod -R 777 /"
]

# 审计日志路径
audit_log = "/var/log/rtdo.log"

# 日志格式: "json" 或 "text"
log_format = "json"
